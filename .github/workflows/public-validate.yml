name: Public Mirror Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validate Package Shape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate package metadata
        shell: bash
        run: |
          set -euo pipefail
          node -e "
            const pkg = require('./package.json');
            if (pkg.name !== '@letterblack/lbe-core') throw new Error('Package name mismatch');
            if (pkg.main !== 'dist/index.js') throw new Error('Public main must be dist/index.js');
            if (pkg.bin.lbe !== 'dist/cli.js') throw new Error('Public bin must be dist/cli.js');
            if (pkg.files && pkg.files.includes('.github/')) throw new Error('.github/ must not appear in npm files field');
          "

      - name: Repository allowlist check
        shell: bash
        run: |
          set -euo pipefail
          ALLOWED='^(.github|assets|dist|docs|\.npmignore|LICENSE|package\.json|README\.md|types\.d\.ts)$'

          for entry in *; do
            if ! echo "$entry" | grep -Eq "$ALLOWED"; then
              echo "HARD STOP: disallowed top-level entry: $entry"
              exit 1
            fi
          done
          echo "Top-level allowlist check passed."

      - name: Forbidden public-repo paths
        shell: bash
        run: |
          set -euo pipefail
          FORBIDDEN="src scripts tests keys config data release-public release-exec .lbe .env package-lock.json"
          for p in $FORBIDDEN; do
            if [ -e "$p" ]; then
              echo "HARD STOP: forbidden path exists in repo: $p"
              exit 1
            fi
          done
          echo "Forbidden path check passed."

      - name: README forbidden-claim scan
        shell: bash
        run: |
          set -euo pipefail
          FORBIDDEN=(
            "LetterBlack-LBE-Core"
            "private source repo"
            "source-of-truth build system"
            "Release Authority"
            "release-authority"
            "MAINHEAD_GUARD"
            "NPM_TOKEN"
            "GITHUB_TOKEN"
            "secretKey"
            "keyId"
            "nonce"
            "HMAC"
            "Ed25519"
            "signEd25519"
            "internal adapter"
            "gate pipeline"
            "executeAdapter"
            "evaluatePolicy"
            "validateCommand"
            "child_process"
            "Used in production"
            "After Effects"
            "LBE Cloud"
            "optional authenticated cloud connection"
            "hosted execution workspace"
            "cloud connection"
          )
          for pattern in "${FORBIDDEN[@]}"; do
            if grep -qi "$pattern" README.md; then
              echo "HARD STOP: README contains forbidden claim: $pattern"
              exit 1
            fi
          done
          echo "README forbidden-claim scan passed."

      - name: README required public-positioning scan
        shell: bash
        run: |
          set -euo pipefail
          REQUIRED=(
            "local-first execution governance SDK"
            "Execution stays local"
            "does not require a hosted service"
            "npx lbe"
            "@letterblack/lbe-core"
            "LBE is not a sandbox"
            "routed through the LBE boundary"
          )
          for pattern in "${REQUIRED[@]}"; do
            if ! grep -qiF "$pattern" README.md; then
              echo "HARD STOP: README missing required wording: $pattern"
              exit 1
            fi
          done
          echo "README required wording check passed."

      - name: NPM pack exact safety
        shell: bash
        run: |
          set -euo pipefail
          PACK_JSON=$(npm pack --dry-run --json 2>/dev/null)
          echo "$PACK_JSON"

          # Required files
          echo "$PACK_JSON" | grep -q "dist/index.js" || (echo "Missing dist/index.js"; exit 1)
          echo "$PACK_JSON" | grep -q "dist/cli.js" || (echo "Missing dist/cli.js"; exit 1)

          # Forbidden paths in npm pack
          FORBIDDEN=".github/ src/ scripts/ tests/ keys/ config/ data/ .lbe/ release-public/ release-exec/ package-lock.json .env"
          for p in $FORBIDDEN; do
            if echo "$PACK_JSON" | grep -q "\"$p"; then
              echo "HARD STOP: forbidden path in npm pack: $p"
              exit 1
            fi
          done
          echo "NPM pack safety check passed."

      - name: Public validation passed
        run: echo "All public mirror validation checks passed."
