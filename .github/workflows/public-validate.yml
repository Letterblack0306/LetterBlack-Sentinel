name: Public Package Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Test and Validate Package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact commit without marketplace actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Validate runner and package metadata
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          node -e "
            const [major, minor] = process.versions.node.split('.').map(Number);
            if (major < 20 || (major === 20 && minor < 9)) throw new Error('Node >=20.9.0 required');
            const pkg = require('./package.json');
            if (pkg.name !== '@letterblack/lbe-core') throw new Error('Package name mismatch');
            if (pkg.main !== 'dist/index.js') throw new Error('Public main must be dist/index.js');
            if (pkg.bin.lbe !== 'dist/cli.js') throw new Error('Public bin must be dist/cli.js');
            if (!pkg.scripts?.test) throw new Error('Public package must define tests');
            if (pkg.files?.includes('.github/')) throw new Error('.github/ must not appear in npm files field');
          "

      - name: Run SDK tests
        run: npm test

      - name: CLI smoke test
        shell: bash
        run: |
          set -euo pipefail
          TMP_DIR=$(mktemp -d)
          cd "$TMP_DIR"
          node "$GITHUB_WORKSPACE/dist/cli.js" init
          node "$GITHUB_WORKSPACE/dist/cli.js" status | grep -q "runtime:  ok"
          node "$GITHUB_WORKSPACE/dist/cli.js" observe
          node "$GITHUB_WORKSPACE/dist/cli.js" enforce

      - name: Dry-run pack and check contents
        shell: bash
        run: |
          set -euo pipefail
          PACK_JSON=$(npm pack --dry-run --json 2>/dev/null)
          echo "$PACK_JSON"

          for required in dist/index.js dist/cli.js dist/lbe_engine.wasm dist/wasm.lock.json types.d.ts README.md SECURITY.md LICENSE; do
            echo "$PACK_JSON" | grep -q "\"$required\"" || (echo "Missing $required"; exit 1)
          done

          FORBIDDEN='.env keys/ tests/ src/ scripts/ .github/ release-public/ package-lock.json'
          for path in $FORBIDDEN; do
            if echo "$PACK_JSON" | grep -q "\"$path"; then
              echo "HARD STOP: forbidden path in npm pack: $path"
              exit 1
            fi
          done

          echo "Public validation passed."
